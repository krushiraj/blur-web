<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Blur (emulated)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0b0b0d;color:#c8c8d0;font:13px/1.4 ui-monospace,Menlo,monospace}
  #wrap{display:flex;flex-direction:column;height:100%}
  #bar{padding:6px 12px;display:flex;gap:16px;align-items:center;background:#15151a;border-bottom:1px solid #26262e}
  #bar b{color:#fff} #status.ok{color:#7ddf8a} #status.bad{color:#ff8080}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  canvas:focus,canvas:focus-visible{outline:none}
  body.idle-cursor,body.idle-cursor canvas{cursor:none}
  canvas{max-width:100%;max-height:100%;aspect-ratio:16/9;background:#000;image-rendering:auto}
  body.hide-bar #bar{display:none} body.hide-log #log{display:none}
  #ui{position:relative;display:flex;gap:6px;align-items:flex-start;justify-content:flex-end;padding:4px 12px;background:#101014;border-bottom:1px solid #26262e}
  :fullscreen #ui{position:fixed;top:8px;right:12px;z-index:50;background:none;border:0;padding:0;opacity:.3;transition:opacity .2s} :fullscreen #ui:hover,:fullscreen #ui.open{opacity:1}
  #ui button{background:#1d1d24cc;color:#e6e6ee;border:1px solid #3a3a46;border-radius:6px;padding:5px 10px;font:12px/1.2 ui-monospace,Menlo,monospace;cursor:pointer} #ui button:hover{background:#2b2b36}
  #menu{display:none;position:absolute;top:100%;right:12px;z-index:60;min-width:190px;background:#15151ae6;border:1px solid #3a3a46;border-radius:8px;padding:8px 10px;flex-direction:column;gap:6px} #ui.open #menu{display:flex}
  #menu label{display:flex;gap:8px;align-items:center;cursor:pointer;color:#d8d8e2;white-space:nowrap} #menu .hint{color:#8a8a98;font-size:11px;margin-top:2px}
  :fullscreen #bar,:fullscreen #log{display:none} :fullscreen #stage{width:100vw;height:100vh} :fullscreen #c{width:100vw;height:100vh;max-width:none;max-height:none;aspect-ratio:auto;object-fit:cover}
  body.fit-contain:fullscreen #c,:fullscreen body.fit-contain #c{object-fit:contain} body.fit-fill #c{object-fit:fill}
  #log{max-height:22vh;overflow:auto;padding:6px 12px;background:#101014;border-top:1px solid #26262e;white-space:pre-wrap;color:#9a9aa8}
</style></head><body>
<div id="wrap">
  <div id="bar"><b>Blur on WebGL2</b><span id="status" class="bad">connecting…</span><span id="inputmode" title="what the game sees as its input device">input: keyboard</span><span id="fps"></span><span id="stats"></span></div>
  <div id="ui"><button id="fsbtn" title="Fullscreen (F11 or double-click the picture)">⛶ Fullscreen</button><button id="menubtn" title="Show / hide panels">☰ Panels</button>
    <div id="menu"><label><input type="checkbox" autocomplete="off" id="cb-bar" checked> Status bar</label><label><input type="checkbox" autocomplete="off" id="cb-log"> Log</label><label><input type="checkbox" autocomplete="off" id="cb-hud"> Frame-time HUD (F2)</label><div class="hint">F11 / double-click = fullscreen</div></div></div>
  <div id="stage"><canvas id="c" width="1280" height="720" tabindex="0"></canvas></div>
  <div id="log"></div>
</div>
<script src="renderer.js"></script>
<script src="hcache.js"></script>
<script>(async () => {
  let canvas = document.getElementById('c'); const statusEl = document.getElementById('status'), logEl = document.getElementById('log');
  const log = (m) => { logEl.textContent += m + '\n'; logEl.scrollTop = logEl.scrollHeight; };
  // #gpu=1: WebGPU renderer (renderer_gpu.js + the offline WGSL pack); any failure (no navigator.gpu / adapter / texture-compression-bc, init error, later device loss) falls back to WebGL2
  const noteEl = document.createElement('span'); noteEl.id = 'gpunote'; noteEl.style.cssText = 'margin-left:8px;color:#e9b44c'; document.getElementById('bar').appendChild(noteEl);
  const note = (m) => { noteEl.textContent = m; };
  const loadScript = (src) => new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('cannot load ' + src)); document.head.appendChild(el); });
  async function makeRenderer() {
    let why = ''; try { why = sessionStorage.getItem('blur.gpufail') || ''; sessionStorage.removeItem('blur.gpufail'); } catch (e) {}
    if (why) { console.warn('[gpu] WebGPU lost earlier, running WebGL2: ' + why); note('WebGPU lost (' + why.slice(0, 80) + '): WebGL2'); }
    if (/gpu=1/.test(location.hash) && !why) {
      let g = null;
      try {
        if (!navigator.gpu) throw new Error('navigator.gpu is missing (WebGPU needs a secure context: https or localhost)');
        await Promise.all([loadScript('wgslpack.js'), loadScript('renderer_gpu.js')]);
        g = new D3D9GpuRenderer(canvas, log); await g.init({ packUrl: 'blur.wgslpack.gz', requireBC: true });
        g.onLost = (info) => { console.warn('[gpu] device lost, reloading with WebGL2: ' + info.message); try { sessionStorage.setItem('blur.gpufail', 'device lost: ' + info.message); } catch (e) {} location.hash = location.hash.replace(/gpu=1/, 'gpu=0'); location.reload(); };
        g.loadWarm('gpu-warm.json'); document.querySelector('#bar b').textContent = 'Blur on WebGPU'; return g;
      } catch (e) {
        console.warn('[gpu] WebGPU renderer unavailable, using WebGL2:', e); note('WebGPU unavailable (' + String(e.message || e).slice(0, 90) + '): using WebGL2');
        if (g && g.ctx) { const c2 = canvas.cloneNode(false); canvas.replaceWith(c2); canvas = c2; }          // a canvas that already has a webgpu context cannot give out webgl2
      }
    }
    return new D3D9Renderer(canvas, log);
  }
  const r = await makeRenderer(); window.__r = r; r.sendInput = (t, a, b, c, d) => send(t, a, b, c, d);
  const hc = r.hc = new HCache(r); window.__hc = hc; window.__wire = { bytes: 0, msgs: 0 };
  let ws, frames = 0, last = performance.now(), msgs = 0, bytes = 0, presented = 0;
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`); ws.binaryType = 'arraybuffer'; window.__ws = ws;
    ws.onopen = () => { statusEl.textContent = 'connected'; statusEl.className = 'ok'; hc.ready.then(() => { if (ws.readyState === 1) hc.announce(ws); }); };
    ws.onclose = (e) => { audioFadeOut(); au.faded = true; const busy = e.code === 1013; statusEl.textContent = busy ? 'another viewer is connected - retrying every 3 s' : 'disconnected - retrying'; statusEl.className = 'bad'; setTimeout(connect, busy ? 3000 : 1000); };
    ws.onmessage = (e) => {
      bytes += e.data.byteLength; window.__wire.bytes += e.data.byteLength; window.__wire.msgs++;
      hc.onData(e.data, (n) => { msgs += n.messages; frames += n.presents;
        if (n.presents) { presented += n.presents; send(9, presented); } });       // flow control: the harness runs at most BLUR_MAXLAG (4) frames ahead of this counter; no ack = no throttling
    };
  }
  // ---- audio: host-mixed 48 kHz stereo PCM (message type 90) -> AudioWorklet. Browsers need a user gesture before audio can start.
  const au = { ctx: null, node: null, master: null, stat: null, pending: [], rx: 0, faded: false, lastRx: 0 };
  const audioStat = () => au.stat ? `audio ${au.ctx && au.ctx.state} buf=${(au.stat.buffered / 48).toFixed(0)}ms under=${au.stat.underruns} drop=${au.stat.dropped}` : (au.ctx ? 'audio waiting' : 'audio: press a key / click');
  // The context is never torn down abruptly: every way the sound can end (tab hidden/closed, socket closed, host exit marker, host silent) goes through a short fade
  // (master GainNode + the worklet's own per-sample ramp) so there is no click.
  function audioFadeOut(tc = 0.012) {                                        // ~40 ms to silence (time constant 12 ms)
    if (!au.ctx || !au.node) return;
    try { au.node.port.postMessage({ stop: 1 }); au.master.gain.cancelScheduledValues(au.ctx.currentTime); au.master.gain.setTargetAtTime(0, au.ctx.currentTime, tc); } catch (e) {}
  }
  function audioFadeIn() {
    if (!au.ctx || !au.node) return;
    try { au.master.gain.cancelScheduledValues(au.ctx.currentTime); au.master.gain.setTargetAtTime(1, au.ctx.currentTime, 0.02); au.node.port.postMessage({ resume: 1 }); } catch (e) {}
  }
  async function audioStart() {
    if (au.ctx) { if (au.ctx.state === 'suspended') { await au.ctx.resume(); audioFadeIn(); } return; }
    try {
      au.ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
      await au.ctx.audioWorklet.addModule('audio-worklet.js');
      au.node = new AudioWorkletNode(au.ctx, 'blur-pcm', { numberOfInputs: 0, outputChannelCount: [2] });
      au.master = au.ctx.createGain(); au.master.gain.value = 0;
      au.node.port.onmessage = (e) => { if (e.data.stats) au.stat = e.data.stats; };
      au.node.connect(au.master); au.master.connect(au.ctx.destination); await au.ctx.resume();
      au.master.gain.setTargetAtTime(1, au.ctx.currentTime, 0.015);                      // fade-in (no pop at start)
      // audio that arrived before the first user gesture is stale: keep only the newest ~150 ms instead of replaying seconds of backlog
      let keep = 0, i = au.pending.length; while (i > 0 && keep < 7200) { i--; keep += (au.pending[i].pcm.byteLength >> 2); }
      for (const m of au.pending.splice(i)) au.node.port.postMessage(m, [m.pcm]); au.pending.length = 0;
    } catch (e) { log('audio init failed: ' + e); au.ctx = null; }
  }
  r.onAudio = (rate, ch, frames, buf) => {
    au.rx += frames; const m = { pcm: buf, rate }; au.lastRx = performance.now();
    if (au.node) { if (au.faded) { au.faded = false; audioFadeIn(); } au.node.port.postMessage(m, [buf]); } else { au.pending.push(m); if (au.pending.length > 100) au.pending.shift(); }
  };
  r.onAudioStop = () => { au.faded = true; audioFadeOut(); };                          // host marker (type 91): the process is exiting / audio ended
  // earliest teardown signals: fade BEFORE the browser kills the audio thread
  addEventListener('pagehide', () => audioFadeOut(0.008), { capture: true });
  addEventListener('beforeunload', () => audioFadeOut(0.008), { capture: true });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { audioFadeOut(); if (au.ctx) setTimeout(() => { if (document.visibilityState === 'hidden' && au.ctx.state === 'running') au.ctx.suspend(); }, 150); }
    else if (au.ctx) { au.ctx.resume().then(audioFadeIn); }
  });
  window.__r = r; window.__audio = au;                                             // test hook (headless checks)
  for (const ev of ['keydown', 'mousedown', 'pointerdown', 'touchstart']) window.addEventListener(ev, audioStart, { once: false });
  if (location.search.includes('audio=1')) audioStart();
  // optional offline shader cache + warm list: when present the harness (BLUR_SHADER_CACHE) sends hashes instead of GLSL
  const loadCache = (async () => { try { await r.loadShaderCache('shaders.bin'); try { await r.loadWarm('warm.json'); } catch (e) {} } catch (e) { log('[renderer] no shader cache: ' + e.message); } })();
  loadCache.then(connect);
  setInterval(() => { const now = performance.now(), dt = (now - last) / 1000; last = now;
    document.getElementById('fps').textContent = `${(frames / dt).toFixed(1)} fps`; document.getElementById('stats').textContent = `${(bytes / dt / 1048576).toFixed(1)} MB/s  ${r.statLine()}  ${audioStat()}`; frames = 0; bytes = 0; msgs = 0; }, 1000);
  // input -> harness (NetInput: 5 x int32: type,a,b,c,d). 1=key down(vk) 2=key up(vk) 3=mouse move(x,y) 4=mouse button(btn,down) 5=wheel
  const send = (t, a = 0, b = 0, c = 0, d = 0) => { if (ws && ws.readyState === 1) ws.send(new Int32Array([t, a, b, c, d]).buffer); };
  // Mac keyboards have no Right Ctrl: = / ] / PageUp send Right Ctrl (LAN: Host Game) and - / [ / PageDown send Right Shift (LAN: Refresh)
  const vk = (e) => ({ArrowLeft:37,ArrowUp:38,ArrowRight:39,ArrowDown:40,Enter:13,Escape:27,Space:32,Tab:9,Backspace:8,ShiftLeft:160,ShiftRight:161,F1:112,F2:113,F3:114,F4:115,F5:116,F6:117,F7:118,F8:119,F9:120,F10:121,F12:123,ControlLeft:162,ControlRight:163,BracketRight:163,BracketLeft:161,PageUp:163,PageDown:161,Equal:163,Minus:161,AltLeft:164,AltRight:165}[e.code] || (e.key.length === 1 ? e.key.toUpperCase().charCodeAt(0) : 0));
  // keys held right now (vk codes): on tab/window switch the browser never delivers the key-up, so the host would see the key held forever
  // (e.g. S = reverse gear for good). Release everything when the page loses focus or is hidden.
  const held = new Map(), heldBtn = new Set();                          // physical key (e.code) -> vk that was sent on key-down (the key-up must release exactly that, even if e.key changed: Shift, layouts, caps lock)
  const releaseAll = () => { for (const k of held.values()) send(2, k); held.clear(); for (const b of heldBtn) send(4, b, 0); heldBtn.clear(); };
  // Gamepad: a pad is reported to the game ONLY while a real controller is connected (browser Gamepad API; press any button on it once so the browser exposes it).
  // Otherwise the game sees no XInput device and uses its own keyboard bindings. The header shows which one is in control.
  const inputEl = document.getElementById('inputmode'); let padKey = '', padSentAt = 0, padWasActive = false;
  const setMode = (txt, cls) => { inputEl.textContent = txt; inputEl.style.color = cls === 'pad' ? '#7ddf8a' : ''; };
  const readPad = () => { const gps = navigator.getGamepads ? navigator.getGamepads() : []; for (const g of gps) if (g && g.connected) return g; return null; };
  const sendPad = () => {
    const g = readPad(); const now = performance.now();
    if (!g) { if (padWasActive) { padWasActive = false; padKey = ''; send(6, 0, 0, 0, 0); setMode('input: keyboard', 'kb'); } return; }
    const B = g.buttons, ax = (i) => Math.max(-32767, Math.min(32767, Math.round((g.axes[i] || 0) * 32767)));
    let btn = 0; const m = [[0, 0x1000], [1, 0x2000], [2, 0x4000], [3, 0x8000], [4, 0x100], [5, 0x200], [8, 0x20], [9, 0x10], [10, 0x40], [11, 0x80], [12, 0x1], [13, 0x2], [14, 0x4], [15, 0x8]];
    for (const [i, bit] of m) if (B[i] && B[i].pressed) btn |= bit;
    const lt = Math.round(((B[6] && B[6].value) || 0) * 255), rt = Math.round(((B[7] && B[7].value) || 0) * 255);
    const lx = ax(0), ly = -ax(1), rx = ax(2), ry = -ax(3);                       // XInput Y axes point up
    const key = [btn, lt, rt, lx, ly, rx, ry].join(',');
    if (key !== padKey || now - padSentAt > 250 || !padWasActive) { padKey = key; padSentAt = now; padWasActive = true; send(6, btn | (lt << 16) | (rt << 24), (lx & 0xffff) | (ly << 16), (rx & 0xffff) | (ry << 16), 1); setMode('input: controller (' + (g.id || 'gamepad').slice(0, 40) + ')', 'pad'); }
  };
  setInterval(sendPad, 8);
  window.addEventListener('gamepaddisconnected', () => sendPad());
  // Interactive panels: status bar / log / HUD toggles (remembered in localStorage) and a fullscreen button.
  const store = { get(k, d) { try { const v = localStorage.getItem('blur.' + k); return v === null ? d : v === '1'; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('blur.' + k, v ? '1' : '0'); } catch (e) {} } };
  const cbBar = document.getElementById('cb-bar'), cbLog = document.getElementById('cb-log'), cbHud = document.getElementById('cb-hud'), uiEl = document.getElementById('ui');
  const hudOn = () => !!(r.hud && r.hud.c && r.hud.c.style.display !== 'none');
  const setHud = (on) => { if (on === hudOn() && r.hud) return; window.dispatchEvent(new KeyboardEvent('keydown', { code: 'F2' })); };      // renderer toggles its HUD on F2
  const applyPanels = () => { document.body.classList.toggle('hide-bar', !cbBar.checked); document.body.classList.toggle('hide-log', !cbLog.checked); store.set('bar', cbBar.checked); store.set('log', cbLog.checked); store.set('hud', cbHud.checked); };
  cbBar.checked = store.get('bar', true); cbLog.checked = store.get('log', false); cbHud.checked = location.hash.includes('hud=1') || store.get('hud', false);
  cbBar.onchange = cbLog.onchange = applyPanels; cbHud.onchange = () => { setHud(cbHud.checked); applyPanels(); }; applyPanels();
  if (cbHud.checked) setTimeout(() => { if (!hudOn()) setHud(true); }, 300);
  document.getElementById('menubtn').onclick = () => { uiEl.classList.toggle('open'); };
  document.addEventListener('click', (e) => { if (!uiEl.contains(e.target)) uiEl.classList.remove('open'); });
  window.addEventListener('keydown', (e) => { if (e.code === 'F2') setTimeout(() => { cbHud.checked = hudOn(); applyPanels(); }, 0); });
  { const f = new URLSearchParams(location.search).get('fit'); if (f === 'contain' || f === 'fill') document.body.classList.add('fit-' + f); }   // ?fit=contain (letterbox) | fill (stretch); default cover = no bars, crops the edges on 16:10 screens
  // Fullscreen: F11 or double-click the picture. Escape is locked (Keyboard Lock API, Chrome) so the game's Esc menu works; leave fullscreen with F11 again.
  const toggleFs = async () => { try { if (document.fullscreenElement) { await document.exitFullscreen(); } else { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); if (navigator.keyboard && navigator.keyboard.lock) { try { await navigator.keyboard.lock(['Escape']); } catch (e) {} } canvas.focus(); } } catch (e) { log('fullscreen: ' + e.message); } };
  canvas.addEventListener('dblclick', toggleFs);
  { let idleT = 0; const wake = () => { document.body.classList.remove('idle-cursor'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle-cursor'), 2000); };      // hide the pointer after 2 s without movement
    document.addEventListener('mousemove', wake); document.addEventListener('mousedown', wake); wake(); }
  document.getElementById('fsbtn').onclick = () => { toggleFs(); canvas.focus(); };
  document.addEventListener('fullscreenchange', () => { document.getElementById('fsbtn').textContent = document.fullscreenElement ? '⛶ Exit fullscreen' : '⛶ Fullscreen'; });
  window.addEventListener('keydown', (e) => { if (e.code === 'F11') { e.preventDefault(); toggleFs(); } }, true);
  window.addEventListener('keydown', (e) => { const k = vk(e); if (!e.repeat || !held.has(e.code)) { held.set(e.code, k); send(1, k); } if (e.code !== 'F12') e.preventDefault(); });
  window.addEventListener('keyup', (e) => { const k = held.has(e.code) ? held.get(e.code) : vk(e); held.delete(e.code); send(2, k); e.preventDefault(); });
  window.addEventListener('blur', releaseAll); window.addEventListener('focus', releaseAll); window.addEventListener('pagehide', releaseAll);
  document.addEventListener('visibilitychange', releaseAll);
  canvas.addEventListener('mousemove', (e) => { const b = canvas.getBoundingClientRect(); send(3, Math.round((e.clientX - b.left) * (r.bb ? r.bb.lw : canvas.width) / b.width), Math.round((e.clientY - b.top) * (r.bb ? r.bb.lh : canvas.height) / b.height)); });
  canvas.addEventListener('mousedown', (e) => { canvas.focus(); heldBtn.add(e.button); send(4, e.button, 1); }); canvas.addEventListener('mouseup', (e) => { heldBtn.delete(e.button); send(4, e.button, 0); });
})();</script></body></html>
