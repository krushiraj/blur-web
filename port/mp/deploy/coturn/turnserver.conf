# coturn for browser WebRTC (REST-style ephemeral credentials; the lobby server derives them from TURN_SECRET, see server/src/ice.js)
listening-port=3478
tls-listening-port=5349
# replace with the public IP of the VPS
external-ip=203.0.113.10
realm=lan.example.com
use-auth-secret
static-auth-secret=change-me-long-random
fingerprint
no-multicast-peers
no-cli
# relay port range: open it in the firewall (UDP)
min-port=49160
max-port=49200
# security: refuse relaying to private ranges (the whole point is traversing the internet)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
# TLS certs (paths inside the container, from Caddy's storage; adjust to your issuer)
cert=/certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/lan.example.com/lan.example.com.crt
pkey=/certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/lan.example.com/lan.example.com.key
# modest quotas for a small box
total-quota=100
user-quota=12
stale-nonce=600
